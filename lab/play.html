<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light only">
<title>Voltix Lab</title>
<style>
  html, body { margin: 0; background: #05060a; color: #8792a8;
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  p { margin: 40vh 16px 0; text-align: center; }
  a { color: #35a3ff; }
</style>
</head>
<body>
<p id="s">Opening…</p>
<script>
// Decrypts one prototype and replaces this page with it. Everything lives inside this
// function so that nothing of the loader is left in the global scope the game runs in.
(function () {
  var SLOT = 'voltixlab.key';
  var s = document.getElementById('s');
  function fail(t) { s.innerHTML = t + '<br><br><a href="./">Back to the lab</a>'; }
  function unb64(x) { var b = atob(x), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function stored() {
    try { var v = sessionStorage.getItem(SLOT); if (v) return v; } catch (e) {}
    try { return localStorage.getItem(SLOT); } catch (e) { return null; }
  }
  var id = new URLSearchParams(location.search).get('g');
  var raw = stored();
  if (!raw || !id) { location.replace('./'); return; }
  if (!window.crypto || !crypto.subtle) { fail('This page needs a secure (https) connection.'); return; }

  var key;
  function openBlob(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('fetch ' + r.status); return r.arrayBuffer();
    }).then(function (buf) {
      var u8 = new Uint8Array(buf);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8.slice(0, 12) }, key, u8.slice(12));
    }).then(function (b) { return new TextDecoder().decode(b); });
  }
  crypto.subtle.importKey('raw', unb64(raw), 'AES-GCM', false, ['decrypt'])
    .then(function (k) { key = k; return openBlob('m.bin'); })
    .then(function (m) {
      var g = JSON.parse(m).games.filter(function (x) { return x.id === id; })[0];
      if (!g) throw new Error('unknown game');
      document.title = g.title;
      return openBlob(g.file);
    })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () { fail('This prototype could not be opened.'); });
})();
</script>
</body>
</html>
