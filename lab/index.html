<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFF7EE">
<title>Voltix Lab</title>
<style>
  :root {
    --paper: #FFF7EE; --card: #FFFFFF; --ink: #4A3B32; --soft: #8A7668;
    --line: #F0E2D3; --accent: #F07C6A; --accent-ink: #FFFFFF; --bad: #C8513F;
    color-scheme: light only;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  h1 { margin: 0; font-size: 28px; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .sub { margin: 4px 0 24px; color: var(--soft); font-size: 15px; }
  .panel { background: var(--card); border-radius: 22px; padding: 22px 18px;
    box-shadow: 0 6px 22px rgba(120, 80, 50, .09); }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input[type=password] { width: 100%; font: inherit; padding: 14px 16px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--paper); color: var(--ink); outline: none; }
  input[type=password]:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; margin: 14px 0 18px; color: var(--soft); font-size: 15px; }
  .row input { width: 22px; height: 22px; accent-color: var(--accent); }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 16px; cursor: pointer; }
  .go { width: 100%; min-height: 54px; background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 4px 0 #D9614F; }
  .go:active { transform: translateY(2px); box-shadow: 0 2px 0 #D9614F; }
  .go[disabled] { opacity: .6; }
  .msg { min-height: 22px; margin-top: 12px; color: var(--bad); font-size: 15px; }
  .list { display: grid; gap: 14px; }
  a.game { display: flex; gap: 14px; align-items: flex-start; text-decoration: none; color: inherit;
    background: var(--card); border-radius: 20px; padding: 16px; min-height: 64px;
    box-shadow: 0 5px 18px rgba(120, 80, 50, .08); border: 2px solid transparent; }
  a.game:active { border-color: var(--line); transform: scale(.99); }
  .dot { flex: 0 0 46px; height: 46px; border-radius: 14px; }
  .g-title { font-weight: 800; font-size: 19px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    background: #FFE3D6; color: #C0553F; padding: 2px 8px; border-radius: 99px; }
  .pitch { margin: 2px 0 6px; }
  .q { color: var(--soft); font-size: 14.5px; }
  .meta { color: var(--soft); font-size: 13px; margin-top: 6px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 0;
    color: var(--soft); font-size: 13px; }
  .lock { background: transparent; color: var(--soft); text-decoration: underline; padding: 10px 4px; min-height: 44px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Voltix <span>Lab</span></h1>
  <p class="sub">Prototypes in testing. Private.</p>

  <form id="gate" class="panel" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="row"><input id="remember" type="checkbox" checked><label for="remember" style="margin:0;font-weight:400">Remember on this device</label></div>
    <button class="go" id="enter" type="submit">Enter</button>
    <div class="msg" id="msg" role="status"></div>
  </form>

  <section id="hub" hidden>
    <div class="list" id="list"></div>
    <div class="bar"><span id="built"></span><button class="lock" id="lock" type="button">Lock this device</button></div>
  </section>
</main>
<script>
(function () {
  var SALT = '7e47334d58a5810032466ed13d04554b', ITER = 600000, SLOT = 'voltixlab.key';
  var $ = function (id) { return document.getElementById(id); };
  function hex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  function b64(u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function get(store) { try { return window[store].getItem(SLOT); } catch (e) { return null; } }
  function put(store, v) { try { window[store].setItem(SLOT, v); } catch (e) {} }
  function drop() { try { localStorage.removeItem(SLOT); } catch (e) {} try { sessionStorage.removeItem(SLOT); } catch (e) {} }

  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: hex(SALT), iterations: ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }
  function importRaw(raw) { return crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['decrypt']); }
  function openBlob(key, url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('fetch ' + r.status); return r.arrayBuffer();
    }).then(function (buf) {
      var u8 = new Uint8Array(buf);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8.slice(0, 12) }, key, u8.slice(12));
    });
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function show(m) {
    var built = new Date(m.built), list = $('list'), html = '';
    m.games.forEach(function (g) {
      var fresh = (built - new Date(g.added)) / 864e5 < 7;
      html += '<a class="game" href="play.html?g=' + encodeURIComponent(g.id) + '">' +
        '<div class="dot" style="background:' + esc(g.colour) + '"></div><div>' +
        '<div class="g-title">' + esc(g.title) + (fresh ? '<span class="badge">New</span>' : '') + '</div>' +
        '<div class="pitch">' + esc(g.pitch) + '</div>' +
        '<div class="q">' + esc(g.question) + '</div>' +
        '<div class="meta">Added ' + esc(g.added) + ' · ' + g.kb + ' KB</div></div></a>';
    });
    list.innerHTML = html;
    $('built').textContent = 'Updated ' + built.toISOString().slice(0, 10);
    $('gate').hidden = true; $('hub').hidden = false;
  }

  function unlock(key) { return openBlob(key, 'm.bin').then(function (buf) { show(JSON.parse(new TextDecoder().decode(buf))); }); }

  if (!window.crypto || !crypto.subtle) {
    $('msg').textContent = 'This page needs a secure (https) connection.'; $('enter').disabled = true; return;
  }

  var saved = get('sessionStorage') || get('localStorage');
  if (saved) importRaw(unb64(saved)).then(unlock).catch(function () { drop(); });

  $('gate').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = $('pw').value; if (!pw) return;
    $('enter').disabled = true; $('msg').textContent = ''; $('enter').textContent = 'Opening…';
    var keyRef;
    derive(pw).then(function (k) { keyRef = k; return unlock(k); })
      .then(function () { return crypto.subtle.exportKey('raw', keyRef); })
      .then(function (raw) {
        var v = b64(new Uint8Array(raw));
        put('sessionStorage', v); if ($('remember').checked) put('localStorage', v);
      })
      .catch(function () { $('msg').textContent = 'That password did not open the lab.'; })
      .then(function () { $('enter').disabled = false; $('enter').textContent = 'Enter'; $('pw').value = ''; });
  });

  $('lock').addEventListener('click', function () { drop(); location.reload(); });
})();
</script>
</body>
</html>
